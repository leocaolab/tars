[package]
name = "tars-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Installs the process's tracing subscriber: log format, filter, and optional OTLP trace and metric export."

[lints]
workspace = true

[dependencies]
# `TARS_LOG_FORMAT` is read through `tars_types::env`.
tars-types = { path = "../tars-types" }

tracing.workspace = true
tracing-subscriber.workspace = true
# Routes the `log` crate's records into the installed subscriber; a direct dependency so `init`
# can tell a taken `log` logger from a taken dispatcher.
tracing-log.workspace = true
thiserror.workspace = true

# OTLP export. Off by default because it pulls a tonic/grpc/prost stack; with the feature on,
# setting `OTEL_EXPORTER_OTLP_ENDPOINT` turns export on at runtime.
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
# Reads a JSON log line as its members in order, each value as written, to put the span's ids first.
serde_json = { workspace = true, optional = true, features = ["raw_value"] }
serde = { workspace = true, optional = true }

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:serde_json",
    "dep:serde",
]

[dev-dependencies]
# The `testing` feature gives the in-memory exporters the otlp tests read; tokio drives the
# metrics PeriodicReader.
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A local OTLP collector for the headers test: the trace and metric services, served by tonic.
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic", "trace", "metrics"] }
tonic = "0.12"
serde_json.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
