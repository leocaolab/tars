[package]
name = "tars-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared core types for tars: requests, events, errors, ids"

[lints]
workspace = true

[dependencies]
# `async-trait` keeps the async `Step` and `Cap` traits object-safe (`Arc<dyn Cap>`).
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
url.workspace = true
# RUN_CONTEXT is a tokio task-local; it lives here because this is the lowest crate both the
# pipeline and the `Tars` handle import.
tokio.workspace = true
tokio-util.workspace = true
uuid = { workspace = true, features = ["v7"] }
# Caller carries the SandboxPolicy that subprocess-spawning providers (CLI delegates) run
# under.
tars-sandbox = { path = "../tars-sandbox" }

[features]
# `Caller::test_default` for dependents' tests: `#[cfg(test)]` only holds
# inside this crate. Enable it from `[dev-dependencies]` only — the merge gate
# refuses a `testutil` feature reached through a normal or build edge.
testutil = []

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }
serde_json.workspace = true
toml = "0.8"
# tests/cap_agents.rs implements the async `Cap` and `Step` traits.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true
# tests/general_enums_hold_no_source_error.rs parses this crate's source to read the variants.
syn = { version = "2", features = ["full", "visit"] }
