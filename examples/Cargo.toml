[package]
name = "tars-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Runnable TARS demos — `cargo run -p tars-examples --example <name>`."

[lints]
workspace = true

# This crate exists only to host the runnable examples under `examples/`.
# It depends on the PUBLIC tars crates the demos `use`; there is no library
# surface of its own (see the empty `src/lib.rs`).
[dependencies]
tars-types = { path = "../crates/tars-types" }
tars-llm = { path = "../crates/tars-llm" }
tars-tools = { path = "../crates/tars-tools" }
tars-config = { path = "../crates/tars-config" }
# `display_chain` renders a demo's error with its causes.
tars-utils = { path = "../crates/tars-utils" }

tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
dirs.workspace = true
