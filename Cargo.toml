[workspace]
resolver = "2"
members = [
    "crates/tars-types",
    "crates/tars-utils",
    "crates/tars-sandbox",
    "crates/tars-config",
    "crates/tars-llm",
    "crates/tars-melt",
    "crates/tars-telemetry",
    "crates/tars-storage",
    "crates/tars-tools",
    "crates/tars-eval",
    "crates/tars-cli",
    "crates/tars-node",
    "examples",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["TARS Team"]
repository = "https://github.com/leocaolab/tars"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
pin-project-lite = "0.2"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema, DERIVED from the Rust type that already declares the shape. A cap's
# `in_schema` and the struct its `call` takes are one declaration or they can disagree,
# and the disagreement is invisible: the model is offered one shape and the cap accepts
# another. NB `schemars::JsonSchema` (the derive trait) and `tars_types::JsonSchema`
# (a carrier for a schema value) are different things — always write the path.
schemars = { version = "0.8", features = ["preserve_order"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }

# HTTP / SSE
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
eventsource-stream = "0.2"
url = { version = "2", features = ["serde"] }

# Errors
thiserror = "1"

# Tracing (instrumentation only — full MELT stack later)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# `.env` parser — the `tars` commands read `$TARS_HOME/.env` so env-var provider
# auth (GEMINI_API_KEY, …) resolves without the user pre-exporting it.
dotenvy = "0.15"
dirs = "5"

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

# Crypto / hash
sha2 = "0.10"
# The journal's site fingerprint: an algorithm named in full, never std's DefaultHasher.
siphasher = "1.0.3"
# UUID — v4 (random: no clock dependency, no MAC leak) for TrajectoryId and
# event ids; v7 only for `CallId`, whose timestamp bits carry the call's
# partition day.
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# sqlx — the one SQLite driver. Async, with versioned migrations
# (sqlx::migrate!). Each DB file gets one SqlitePool. It replaced rusqlite +
# refinery + spawn_blocking across the stores, and both are now gone from the
# tree, so there is no second driver and no second migration mechanism.
#
# `macros` is on for `sqlx::migrate!` (compile-time-embeds the migration dir, no
# DB needed); we do NOT yet use the compile-time-checked
# `query!` — queries go through runtime `sqlx::query` with bound params (still
# injection-safe). Moving to `query!` + a committed `.sqlx` offline cache is a
# later hardening step.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Test deps
wiremock = "0.6"
tokio-test = "0.4"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Production-grade defaults; loosen per-crate if needed.
all = { level = "warn", priority = -1 }
