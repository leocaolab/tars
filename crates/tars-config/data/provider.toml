# ─────────────────────────────────── Gemini ───────────────────────────────────
# base: Google Generative Language API (NOT Vertex)  ·  key: GEMINI_API_KEY
[providers.gemini]
interface = "http"
gen_ai_provider_name = "gcp.gemini"
billed = "per_token"
default = "flash@latest"

  [providers.gemini.capabilities]
  structured_output = "strict_schema"    # responseSchema
  tool_use = true
  parallel_tool_calls = true
  cancel = true
  streaming = true
  prompt_cache = { implicit_prefix = { min_tokens = 1024 } }   # ALSO supports explicit_object (cachedContent)
  # Thinking is billed at each model's output rate, which is not one provider number, so no
  # thinking price is carried and thinking tokens are priced at 0.

  [providers.gemini.series]
  flash = "gemini-{version}-flash"
  flash-lite = "gemini-{version}-flash-lite"
  pro = "gemini-{version}-pro"

# gemini-4-argon: the price is the rate through 2026-11-30; from 2026-12-01 it is 4.00 in /
# 20.00 out / 0.20 cached. Implicit caching only (explicit cachedContent is not supported). It
# matches no series, so `pro@latest` does not pick it.
[[providers.gemini.models]]
id = "gemini-4-argon"
tier = "flagship"
input = 2.00
output = 10.00
cached_input = 0.10
context = 1_048_576          # one window shared by input, thinking and output
max_output = 65_536          # synchronous default; up to 1_048_576 with long decode
thinking = "only"            # levels low/medium/high, default medium
thinking_param = "level"
modalities = ["text", "image", "audio", "video", "pdf"]
status = "ga"

# 3.6 / 3.7 / 3.8 flash: prices are the intro rate through 2026-12-31; from
# 2027-01-01 they are 1.50 in / 7.50 out / 0.15 cached.
