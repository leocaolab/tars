[package]
name = "tars-agent2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The coalgebra runtime: agent = one decide-emit process; god-program = the algebra that drives it to a fixed point."

[lints]
workspace = true

[dependencies]
# The LLM call goes through the pipeline — NOT raw HTTP. `LlmAgent`
# constructs an `LlmService` via `LlmService::builder(..)` and calls it
# with a `ChatRequest`, draining the `LlmEventStream`.
tars-pipeline = { path = "../tars-pipeline" }
tars-types = { path = "../tars-types" }
tars-provider = { path = "../tars-provider" }

async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
