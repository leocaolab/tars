# ────────────────────────────────── DeepSeek ──────────────────────────────────
# base: https://api.deepseek.com (OpenAI-compatible wire, OWN provider)
[providers.deepseek]
interface = "http"
billed = "per_token"
default = "deepseek-flash"

  [providers.deepseek.capabilities]
  structured_output = "json_object"  # NOT strict (schema enforce only for tool args)
  tool_use = true
  parallel_tool_calls = false        # UNKNOWN — couldn't confirm; conservative false
  cancel = true
  streaming = true
  prompt_cache = { implicit_prefix = { min_tokens = 1024 } }   # on-disk context cache; no cache-write fee

# Prices are the PEAK rate (01:00-04:00 and 06:00-10:00 UTC, Mon-Fri) — the
# worst case a budget must assume; off-peak is half, in the comments.
# max_output: the API accepts max_tokens 1..393216 (384K); an unset max_tokens
# defaults to 8K (non-thinking) / 64K (thinking).
[[providers.deepseek.models]]
id = "deepseek-flash"
tier = "fast"
input = 0.30                 # off-peak 0.15
output = 1.20                # off-peak 0.60
cached_input = 0.006         # off-peak 0.003
context = 1_000_000
max_output = 393_216
thinking = "optional"
modalities = ["text", "image"]  # served by DeepSeek-V4.1-Flash-1017, which takes images
status = "ga"
aliases = ["deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]  # legacy names of retired models,
                                                                 # still accepted; served and
                                                                 # billed as deepseek-flash

