[package]
name = "tars-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "How tars is tested and scored — bless, cassette diff, invariants, the eval engine, judges, metamorphic relations, trajectory scoring."

[lints]
workspace = true

[dependencies]
tars-types = { path = "../tars-types" }
tars-pipeline = { path = "../tars-pipeline" }
# The replay engine drives a real registry and a real tool set.
tars-provider = { path = "../tars-provider" }
tars-tools = { path = "../tars-tools" }
tars-utils = { path = "../tars-utils" }

# Async
async-trait.workspace = true
anyhow.workspace = true
# The crate carries its own `tars harness` arg definitions (src/cli.rs).
clap = { workspace = true, features = ["derive"] }
tokio-util.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Errors / tracing
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
