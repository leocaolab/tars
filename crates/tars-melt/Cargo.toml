[package]
name = "tars-melt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The event log: the call, wire and journal tables, their ports, and the Parquet adapter."

[lints]
workspace = true

[dependencies]
tars-types = { path = "../tars-types" }
tars-utils = { path = "../tars-utils" }
# `ParquetTrajectoryLog` implements its durable store journal port. Optional, so a writer that
# needs only the log ports links no SQLite.
tars-storage = { path = "../tars-storage", optional = true }

tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
sha2.workspace = true
uuid.workspace = true

tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
bytes.workspace = true

# The Parquet log adapter; opt-in because arrow and parquet are heavy. fs4 is the partition
# `flock`, because std's `File::lock` is newer than the workspace MSRV.
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"], optional = true }
arrow-array = { version = "59.2", optional = true }
arrow-schema = { version = "59.2", optional = true }
fs4 = { version = "1.1", optional = true }
# Tenant ids become `tenant=<t>` path segments.
percent-encoding = { version = "2", optional = true }
# A `date=<YYYY-MM-DD>` directory name read back as the partition's day.
chrono = { workspace = true, optional = true }
# A merge streams its sorted inputs through `kmerge_by`.
itertools = { version = "0.14", optional = true }
# Frozen past-day files are uploaded to the deployment's bucket. Without `object-store-cloud` only
# the local file system and in-memory stores are built in.
object_store = { version = "0.14", optional = true }
url = { workspace = true, optional = true }

[features]
default = []
parquet = [
    "dep:tars-storage",
    "dep:parquet",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:fs4",
    "dep:percent-encoding",
    "dep:chrono",
    "dep:itertools",
    "dep:object_store",
    "dep:url",
]
# The S3 (and S3-compatible), GCS and Azure clients a bucket URL may name.
object-store-cloud = ["parquet", "object_store/aws", "object_store/gcp", "object_store/azure"]

[dev-dependencies]
futures.workspace = true
tempfile = "3"
# The durable store file's tests read it on a read-only connection of their own, as the debugger does.
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
