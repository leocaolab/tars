[package]
name = "tars-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Persistent stores for the TARS Runtime — AgentEventLog (M3), Blackboard, DurableStore."

[lints]
workspace = true

[dependencies]
tars-types = { path = "../tars-types" }

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
# Stream combinators for the read-only reader, which streams rows to a ceiling
# rather than collecting a whole table.
futures.workspace = true

# Persistence
sqlx.workspace = true

# XDG path resolution for default file locations
dirs.workspace = true

# Errors / tracing
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
