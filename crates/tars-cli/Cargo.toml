[package]
name = "tars-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `tars` command line."

[lints]
workspace = true

[dependencies]
tars-types = { path = "../tars-types" }
tars-utils = { path = "../tars-utils" }
tars-eval = { path = "../tars-eval" }
tars-llm = { path = "../tars-llm" }
tars-tools = { path = "../tars-tools" }
tars-config = { path = "../tars-config" }
# `parquet`: `tars events` reads the call log through `LogStores`.
tars-melt = { path = "../tars-melt", features = ["parquet"] }
tars-telemetry = { path = "../tars-telemetry" }
clap = { workspace = true, features = ["derive"] }
futures.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
dotenvy.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
wiremock.workspace = true
# The root-span test reads the trace ids the OTel layer gives the run's spans from an in-memory
# exporter.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["testing"] }
tracing-opentelemetry = "0.28"

[[bin]]
name = "tars"
path = "src/bin/tars.rs"

[features]
default = []
# Build `tars` with OpenTelemetry OTLP trace export. Forwards to tars-telemetry's
# `otlp` feature (heavy tonic/grpc stack, hence opt-in).
otlp = ["tars-telemetry/otlp"]
