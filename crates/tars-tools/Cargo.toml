[package]
name = "tars-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Tool trait, a ToolRegistry that dispatches tool calls, and built-in tools."

[lints]
workspace = true

[dependencies]
tars-types = { path = "../tars-types" }
tars-utils = { path = "../tars-utils" }
tars-sandbox = { path = "../tars-sandbox" }

# `web.fetch` and `web.search` are adapters over `sisurf_core::{fetch, search}`.
sisurf-core = { git = "https://github.com/leocaolab/sisurf", tag = "v0.3.1" }

# Async
tokio = { workspace = true, features = ["fs", "rt"] }
tokio-util.workspace = true
async-trait.workspace = true

# ripgrep's and fd's engines, linked in so the host does not need `rg` or `fd` installed.
grep = "0.3"
ignore = "0.4"
globset = "0.4"

# memory tool: URL-decoding for the traversal check, ISO 8601 `modified` stamps.
percent-encoding = "2"
chrono.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Errors / tracing
thiserror.workspace = true
tracing.workspace = true

# `openat` and `mkdirat` with `O_NOFOLLOW`, so a confined read or write never follows a symlink;
# `kill(-pgid)`, so a `bash.run` that ends early takes the processes its command started with it.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
