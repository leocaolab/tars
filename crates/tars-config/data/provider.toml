# ═══════════════════════════════ CLI providers ════════════════════════════════
# All: structured_output=none, because --output-schema is silently ignored when
# tools/MCP are active, and these are always tool-carrying agent runs.
# tool_use=false (internal loop). prompt_cache=delegated. pricing ALL BLANK.
# streaming/cancel forced false (buffered AgentCliBackend); the CLI's own
# stream/cancel behaviour is in comments.

# ────────────────────────── claude_cli (claude -p) ─────────────────────────────
[providers.claude_cli]
interface = "cli"
gen_ai_provider_name = "anthropic"
billed = "subscription"
default = "claude-opus-4-7"

  [providers.claude_cli.capabilities]
  structured_output = "none"
  tool_use = false
  parallel_tool_calls = false
  cancel = false             # native: mid-run interrupt_receipt_v1 (tars buffers)
  streaming = false          # native: stream-json (tars buffers)
  prompt_cache = "delegated"

# Output clamp: CLAUDE_CODE_MAX_OUTPUT_TOKENS (env default ~32k, commonly 64k,
