name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin a recent stable Rust so contributor toolchain drift doesn't
  # break the workspace. Keep aligned with `Cargo.toml#rust-version`.
  RUST_TOOLCHAIN: stable

jobs:
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The write-jail is bubblewrap on Linux, and the delegate security tests
      # drive the real thing rather than a stub. Without it the spawn fails and
      # the guard that proves a delegate cannot write outside its worktree does
      # not run — which is the one outcome a security test must never have.
      - name: Install bubblewrap (Linux write-jail)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 23.10+ ships an AppArmor profile that forbids unprivileged
          # user namespaces, which is exactly what `bwrap --unshare-user` needs:
          # without this it fails with "setting up uid map: Permission denied".
          # A CI runner is a throwaway VM, so re-enabling it here costs nothing
          # and is the difference between running the jail test and pretending to.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / --unshare-user true \
            && echo "bwrap userns: OK" \
            || echo "bwrap userns: still blocked — the jail tests will say so"

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The `otlp` feature is off by default (heavy tonic/grpc deps), so
      # the workspace gates above don't compile it. Check + test it
      # explicitly so the OpenTelemetry bridge can't rot.
      - name: tars-telemetry otlp feature (clippy + test)
        run: |
          cargo clippy -p tars-telemetry --features otlp --all-targets -- -D warnings
          cargo test -p tars-telemetry --features otlp

      # The `cli` feature is on by default; without it the HTTP backends must
      # still build, and a registry must still build and refuse a CLI provider
      # only when asked for it.
      - name: tars-llm without the cli feature (clippy + test)
        run: |
          cargo clippy -p tars-llm --no-default-features --all-targets -- -D warnings
          cargo test -p tars-llm --no-default-features

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

