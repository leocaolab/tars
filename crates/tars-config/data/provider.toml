# The providers and models tars knows, written by tars (not the user's ~/.tars/config.toml),
# compiled in and parsed once into MODEL_KB (crates/tars-config/src/model_kb.rs). Each
# `[providers.X]` block says how tars reaches the provider (`interface`), how it bills
# (`billed`), its capabilities (`[providers.X.capabilities]`) and its model rows.
#
# The numbers come from a research pass over each provider's documentation; the notes below
# call that "the research". Prices are standard-tier USD per 1M tokens;
# tiered / intro / audio prices live in comments, not fields. A value the
# research couldn't confirm is left blank with a `# UNKNOWN` comment; a value
# that is genuinely absent (subscription/local — no per-token price; no
# documented ceiling) is left blank, meaning "no limit / no charge".
#
# This file is the SHIPPED layer of the model catalog. `tars models update`
# writes the LIVE layer ($TARS_HOME/models.json: each provider's current model
# ids + the context/output limits its API reports). At runtime a live limit
# wins over the number here, and `<series>@latest` picks from the live id list,
# so a model release is picked up without a tars release. Prices, thinking
# mode and tier exist only here — the list APIs don't report them; the refresh
# report names every live model this file doesn't describe yet.
#
# `default` may be a concrete id or a `<series>@latest` spec. A provider's
# `[providers.X.series]` maps a series name to an id pattern with one
# `{version}` slot (dot-separated numbers); an id may also carry a `-preview`
# suffix. `latest` = the highest version, a GA id beating a preview of the
# same version.
#
# A CLI provider's `capabilities` are what tars offers, not what the CLI does: every CLI runs
# under the buffered AgentCliBackend, which emits after the turn, so `streaming` and `cancel`
# are false even where the CLI streams or can be interrupted (the registry's CLI conformance
# test requires it). The CLI's own behaviour is noted in comments per provider.

schema_version = 2
verified = "2026-11-09"

# ═══════════════════════════════ Model vendors ════════════════════════════════
# Which lab made a model, recognised by how its id starts. It is a fact of the model, not of the
# provider that serves it: `anthropic`, `claude_cli` and `claude_sdk` all serve Claude, and a
# local server may serve anyone's weights. An id no prefix matches has no known vendor. A test
# requires every model id and alias below to match exactly one vendor.

[vendors.anthropic]
model_id_prefixes = ["claude-"]

[vendors.openai]
model_id_prefixes = ["gpt-"]

[vendors.google]
model_id_prefixes = ["gemini-"]

[vendors.deepseek]
model_id_prefixes = ["deepseek-"]

[vendors.xai]
model_id_prefixes = ["grok-"]

# ═══════════════════════════════ HTTP providers ═══════════════════════════════

# ─────────────────────────────────── OpenAI ───────────────────────────────────
# base: https://api.openai.com/v1  ·  key: OPENAI_API_KEY
[providers.openai]
interface = "http"
gen_ai_provider_name = "openai"
billed = "per_token"
default = "gpt-5.4"          # reasoning defaults low → fast/cheap, toggleable up
coding_default = "gpt-5.6-sol"   # codex fronts these

  [providers.openai.capabilities]
  structured_output = "strict_schema"
  tool_use = true
  parallel_tool_calls = true
  cancel = true
  streaming = true             # EXCEPT gpt-5.5-pro (per-model; not expressible here)
  prompt_cache = { implicit_prefix = { min_tokens = 1024 } }
  # cache-write fee (30-minute retention) is charged on the GPT-6 and GPT-5.6 families at 1.25×
  # input — per-model, so it is each row's `cache_write`, not a provider number; the 12-hour
  # retention write is 2× input. reasoning tokens billed at output rate (per-model output rate;
  # no single provider thinking price to carry).
  # A prompt over 272K input tokens is billed at the long-context rate for the whole request
  # (GPT-6 / 6.1 / 5.6 / 5.5 / 5.4 families: 2× input and cache, 1.5× output); the fields hold
  # the ≤272K rate and each row's comment gives its long-context rate.

[[providers.openai.models]]
id = "gpt-6-astra"
tier = "flagship"
input = 10.00                # >272K tier: 20.00 in / 75.00 out / 2.00 cached
output = 50.00
cached_input = 1.00
cache_write = 12.50
context = 1_050_000
max_output = 128_000
thinking = "only"            # reasoning.effort low..max; no `none`
modalities = ["text", "image"]
status = "ga"

