# ─── Local (openai_compat family) — user picks the model, no fixed default ────
# No model rows: the user loads whatever model at a localhost base_url, so
# per-model facts (context/output/pricing) come from the user's config /
# CapabilitiesOverrides, not this DB. Only the provider-level facts are known.

[providers.vllm]
interface = "http"
billed = "free"

  [providers.vllm.capabilities]
  structured_output = "strict_schema"   # guided_json (modern vLLM default)
  tool_use = true
  parallel_tool_calls = false           # tool-call quality varies
  cancel = true
  streaming = true
  prompt_cache = "none"                  # local = no billing incentive
  chat_template_thinking = true          # serves the model through its chat template

[providers.mlx]
interface = "http"
billed = "free"

